aid: coinbase-global
name: Coinbase Global
description: >-
  Coinbase Global, Inc. is a publicly traded cryptocurrency platform that
  operates a retail exchange, an institutional trading and custody business
  (Coinbase Prime), and the Coinbase Developer Platform (CDP) — a suite of
  APIs, SDKs, and onchain tooling for wallets, payments, trading, staking, and
  AI agents. Developers build against the CDP API v2, the Advanced Trade API,
  the Coinbase App (Sign in with Coinbase) API, the Exchange and Prime APIs, and
  Coinbase Commerce, with authentication via short-lived JWTs signed by project
  API keys. CDP ships first-party TypeScript and Python SDKs, a CLI that doubles
  as a local MCP server, AgentKit for AI agents, webhooks, and idempotent write
  semantics. This profile was added to the API Evangelist network from a
  venture-portfolio lead and enriched from Coinbase's public developer surface.
